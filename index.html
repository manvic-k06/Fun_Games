<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manan's Games</title>
<style>
:root{--bg:#f4f3ef;--card:#ffffff;--fg:#1f2330;--muted:#676c7b;--line:#d9d7d0}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1d2029;--fg:#eceef3;--muted:#9097a8;--line:#2e323d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:48px 16px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-size:clamp(30px,6vw,44px)}
header p{margin:8px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.12);outline:none}
.art{height:110px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;letter-spacing:.04em}
.body{padding:4px 16px 16px}
.body h2{margin:0 0 4px;font-size:18px}
.body p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.ttt{background:#fbe3d6;color:#d94f2a}
.guess{background:#d8ecf5;color:#2a7fa6}
.flappy{background:linear-gradient(#5ec4f0,#bfe9f7);color:#ffd23f;-webkit-text-stroke:2px #1b2838}
footer{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Manan's Games</h1>
    <p>Pick a game and play right in your browser.</p>
  </header>
  <div class="grid">
    <a class="card" href="flappy-tower.html">
      <div class="art flappy">●</div>
      <div class="body"><h2>Flappy Tower</h2><p>Flap through the gaps between towers and beat your best.</p></div>
    </a>
    <a class="card" href="tic-tac-toe.html">
      <div class="art ttt">X O</div>
      <div class="body"><h2>Tic Tac Toe</h2><p>Classic two-player game with a running scoreboard.</p></div>
    </a>
    <a class="card" href="guess-the-number.html">
      <div class="art guess">?</div>
      <div class="body"><h2>Guess the Number</h2><p>The computer picks 1 to 10. You get one guess.</p></div>
    </a>
  </div>
  <footer>Made by Manan Vichare</footer>
</main>
</body>
</html>
