<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tic Tac Toe</title>
<style>
:root{--bg:#f6f5f2;--card:#ffffff;--fg:#1f2330;--muted:#6b7080;--line:#dcdad4;--x:#e4572e;--o:#2e86ab;--win:#ffe9a8}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1d2029;--fg:#eceef3;--muted:#9097a8;--line:#2e323d;--x:#ff7a59;--o:#5bb8e0;--win:#4a4220}}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.wrap{width:100%;max-width:380px;text-align:center}
h1{font-size:28px;letter-spacing:.02em;margin-bottom:16px}
.scores{display:flex;justify-content:space-between;gap:8px;margin-bottom:16px}
.score{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-size:13px;color:var(--muted);transition:.2s}
.score b{display:block;font-size:22px;color:var(--fg);margin-top:2px}
.score.active{border-color:currentColor;box-shadow:0 0 0 2px currentColor inset}
.score.x.active{color:var(--x)}.score.o.active{color:var(--o)}
#status{font-weight:600;min-height:24px;margin-bottom:14px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;aspect-ratio:1}
.cell{background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:clamp(44px,15vw,64px);font-weight:800;cursor:pointer;color:var(--fg);display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s}
.cell:hover:not(:disabled){background:var(--line)}
.cell:active:not(:disabled){transform:scale(.96)}
.cell:disabled{cursor:default}
.cell.X{color:var(--x)}.cell.O{color:var(--o)}
.cell.win{background:var(--win)}
.cell span{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.actions{display:flex;gap:8px;margin-top:16px}
button.btn{flex:1;font:inherit;font-weight:600;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.btn:hover{opacity:.85}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tic Tac Toe</h1>
  <div class="scores">
    <div class="score x" id="sx">Player X<b id="wx">0</b></div>
    <div class="score" id="sd">Draws<b id="wd">0</b></div>
    <div class="score o" id="so">Player O<b id="wo">0</b></div>
  </div>
  <div id="status"></div>
  <div class="board" id="board"></div>
  <div class="actions">
    <button class="btn primary" id="again">New round</button>
    <button class="btn" id="reset">Reset scores</button>
  </div>
</div>
<script>
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const boardEl=document.getElementById('board'),statusEl=document.getElementById('status');
const cells=[];
let board,turn,over,starter='X';
const wins={X:0,O:0,D:0};

for(let i=0;i<9;i++){
  const c=document.createElement('button');
  c.className='cell';c.setAttribute('aria-label','Square '+(i+1));
  c.onclick=()=>play(i);
  boardEl.appendChild(c);cells.push(c);
}

function newRound(){
  board=Array(9).fill(null);turn=starter;over=false;
  starter=starter==='X'?'O':'X'; // players alternate who starts
  cells.forEach(c=>{c.className='cell';c.innerHTML='';c.disabled=false});
  render();
}

function play(i){
  if(over||board[i])return;
  board[i]=turn;
  cells[i].innerHTML='<span>'+turn+'</span>';
  cells[i].classList.add(turn);cells[i].disabled=true;
  const line=LINES.find(l=>l.every(k=>board[k]===turn));
  if(line){
    over=true;wins[turn]++;
    line.forEach(k=>cells[k].classList.add('win'));
    statusEl.textContent='Player '+turn+' wins!';
  }else if(board.every(Boolean)){
    over=true;wins.D++;
    statusEl.textContent="It's a draw!";
  }else{
    turn=turn==='X'?'O':'X';
  }
  if(over)cells.forEach(c=>c.disabled=true);
  render();
}

function render(){
  if(!over)statusEl.textContent='Player '+turn+"'s turn";
  document.getElementById('wx').textContent=wins.X;
  document.getElementById('wo').textContent=wins.O;
  document.getElementById('wd').textContent=wins.D;
  document.getElementById('sx').classList.toggle('active',!over&&turn==='X');
  document.getElementById('so').classList.toggle('active',!over&&turn==='O');
}

document.getElementById('again').onclick=newRound;
document.getElementById('reset').onclick=()=>{wins.X=wins.O=wins.D=0;starter='X';newRound()};
newRound();
</script>
</body>
</html>
